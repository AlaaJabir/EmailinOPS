name: Restore full Send Email UI

on:
  push:
    paths:
      - .github/workflows/restore-send-email-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full SendEmailView from last known-good UI commit
        shell: bash
        run: |
          set -euo pipefail
          GOOD_COMMIT="950212f4a08200b7df79b62854a9b7458ff0d320"
          git checkout "$GOOD_COMMIT" -- src/views/SendEmailView.tsx

      - name: Preserve current tracking flags in test email
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/views/SendEmailView.tsx")
          s = p.read_text()
          old = '''    await onSendTest({
      testEmail: testRecipient,
      fromEmail,
      subject: testSubject,
      htmlBody: testHtml,
    });'''
          new = '''    await onSendTest({
      testEmail: testRecipient,
      fromEmail,
      subject: testSubject,
      htmlBody: testHtml,
      enableOpenTracking,
      enableClickTracking,
    });'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Commit restored UI on the current branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/SendEmailView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore complete mailer send UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
